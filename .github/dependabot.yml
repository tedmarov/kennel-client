version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      security-production:
        applies-to: security-updates
        dependency-type: production
      security-development:
        applies-to: security-updates
        dependency-type: development
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      production-major:
        dependency-type: production
        update-types:
          - major
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      development-major:
        dependency-type: development
        update-types:
          - major
